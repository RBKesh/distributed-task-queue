<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Queue Monitor</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #bb86fc; }
        h1, h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>System Monitor</h1>
    <div class="grid">
        <div class="card">
            <h2>Queue Depth</h2>
            <div class="stat-value" id="queueDepth">-</div>
        </div>
        <div class="card">
            <h2>Active Workers</h2>
            <div class="stat-value" id="workers">-</div>
        </div>
        <div class="card">
            <h2>System Status</h2>
            <div class="stat-value" id="status" style="color: #03dac6;">-</div>
        </div>
    </div>
    
    <script>
        async function updateStats() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                document.getElementById('queueDepth').innerText = data.queue_depth;
                document.getElementById('workers').innerText = data.workers;
                document.getElementById('status').innerText = data.status;
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>
</html>
